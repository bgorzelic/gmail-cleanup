# Vetted noise-sender kill list.
#
# These domains/senders are confirmed safe to mass-unsubscribe and archive
# (newsletters, marketing, job spam, dating spam, retail blasts). Matched
# as a substring against the sender's email/domain.
#
# Override the auto-discovery threshold — anything in this list is unsubscribed
# even if it sent only 1 message.
#
# Add a sender here if you've manually verified it's pure noise. Remove if
# you want it back. Comments are preserved across edits.

# This packaged seed is intentionally empty: what counts as noise is personal
# (one person's newsletter is another's favorite). Put your own entries in
# ~/.gmail_cli/lists/kill.yaml, for example:
#
#   - example-marketing.com
#   - jobalerts-noreply@example.com
[]
